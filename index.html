<title>River City Quest</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link href="https://fonts.googleapis.com/css2?family=Press+Start+2P&family=Barlow+Semi+Condensed:wght@500;600&display=swap" rel="stylesheet">
<style>
:root{
  /* Layout: one screen. Slim masthead, game canvas fills the middle, thumb controls along the bottom. */
  --night:#12141c;      /* page ground: fog at night */
  --slate:#1e2230;      /* raised surfaces */
  --fog:#aeb7c2;        /* body text */
  --brick:#9a4b38;      /* Richmond brick, the action colour */
  --river:#3f7f96;      /* the James */
  --lamp:#f2c14e;       /* gaslight accent */
  --display:"Press Start 2P", ui-monospace, Menlo, monospace;
  --body:"Barlow Semi Condensed", system-ui, sans-serif;
  color-scheme:dark;
}
*{box-sizing:border-box}
html,body{height:100%;margin:0}
body{background:var(--night);color:var(--fog);font-family:var(--body);display:flex;flex-direction:column;overflow:hidden;
  -webkit-user-select:none;user-select:none;-webkit-touch-callout:none;touch-action:none}
header{display:flex;align-items:baseline;justify-content:space-between;gap:12px;padding:10px 16px 8px;border-bottom:2px solid var(--slate)}
h1{font-family:var(--display);font-size:11px;letter-spacing:.5px;margin:0;color:var(--lamp);font-weight:400}
header p{margin:0;font-size:14px;font-weight:500;white-space:nowrap;overflow:hidden;text-overflow:ellipsis}
.keys{display:none}
#stage{flex:1;min-height:0;display:flex;align-items:center;justify-content:center;padding:8px 16px}
canvas{display:block;max-width:100%;max-height:100%;image-rendering:pixelated;border:3px solid var(--slate);border-radius:4px;background:#000;touch-action:none}
#controls{display:flex;align-items:center;justify-content:space-between;padding:6px 22px 22px;gap:16px}
#pad{position:relative;width:140px;height:140px;border-radius:50%;background:var(--slate);border:2px solid #2c3246;touch-action:none;flex:none}
#pad i{position:absolute;width:0;height:0;border:9px solid transparent;opacity:.75}
#pad .u{left:50%;top:14px;margin-left:-9px;border-bottom-color:var(--fog);border-top-width:0}
#pad .d{left:50%;bottom:14px;margin-left:-9px;border-top-color:var(--fog);border-bottom-width:0}
#pad .l{top:50%;left:14px;margin-top:-9px;border-right-color:var(--fog);border-left-width:0}
#pad .r{top:50%;right:14px;margin-top:-9px;border-left-color:var(--fog);border-right-width:0}
#knob{position:absolute;left:50%;top:50%;width:46px;height:46px;margin:-23px 0 0 -23px;border-radius:50%;background:#394058;pointer-events:none}
#act{width:92px;height:92px;border-radius:50%;border:0;background:var(--brick);color:#fff;font-family:var(--display);font-size:11px;line-height:1.5;
  box-shadow:0 5px 0 #6c3020;touch-action:none;flex:none}
#act:active,#act.on{transform:translateY(3px);box-shadow:0 2px 0 #6c3020}
#act:focus-visible{outline:3px solid var(--lamp);outline-offset:3px}
@media (hover:hover) and (pointer:fine){
  #controls{display:none}
  .keys{display:inline}
  .touch{display:none}
  #stage{padding-bottom:16px}
}
</style>
</head>

  if(opens.includes('E'))for(let y=4;y<=6;y++)m[y][COLS-1]=base;
  for(const [t,x,y,w=1,h=1] of feats)for(let yy=y;yy<y+h;yy++)for(let xx=x;xx<x+w;xx++)m[yy][xx]=t;

}

function load(id){
  cur=SC[id];curId=id;enemies=[];shots=[];picks=[];parts=[];fade=10;
  if(!cur.cv){cur.torches=[];cur.cv=[0,1,2,3].map(f=>renderMap(cur,f));for(const n of cur.npcs||[])n.spr=npcSpr(n);}
  if(!cur.interior)st.ow=[cur.mx,cur.my];
  if(!(cur.interior&&st.cleared[id]))for(const [t,tx,ty] of cur.en)enemies.push(mk(t,tx*TS+8,ty*TS+8));
  for(const it of cur.items||[])if(!st.got[it.id])picks.push({x:it.tx*TS+8,y:it.ty*TS+8,kind:it.kind,id:it.id,life:1e9});
  if(cur.interior&&st.cleared[id]&&cur.reward&&!st.got[cur.reward])picks.push({x:128,y:88,kind:'keystone',id:cur.reward,life:1e9});
}
const nKeys=()=>['granite','iron','brick'].filter(k=>st.got[k]).length;
function burst(x,y,n,cols,sp0,size){for(let i=0;i<n;i++){const a=Math.random()*6.283,v=sp0*(.4+Math.random());parts.push({x,y,vx:Math.cos(a)*v,vy:Math.sin(a)*v,life:14+rnd(10),max:24,c:cols[rnd(cols.length)],s:size});}}

/* ---------- sound ---------- */
let ac=null;
function wake(){if(ac)return;try{ac=new (window.AudioContext||window.webkitAudioContext)();}catch(e){ac=null;}}
function sfx(f,d,type,v){if(!ac)return;try{const o=ac.createOscillator(),gn=ac.createGain();o.type=type||'square';o.frequency.value=f;
  gn.gain.value=v||.04;gn.gain.exponentialRampToValueAtTime(.0001,ac.currentTime+(d||.08));o.connect(gn);gn.connect(ac.destination);o.start();o.stop(ac.currentTime+(d||.08));}catch(e){}}

/* ---------- dialog ---------- */
function say(lines,cb){
  const pages=[];
  for(const s of lines){let ls=[],l='';
    for(const w of s.split(' ')){const n=l?l+' '+w:w;if(n.length>27){ls.push(l);l=w;}else l=n;}
    if(l)ls.push(l);
    for(let i=0;i<ls.length;i+=3)pages.push(ls.slice(i,i+3));}
  dlg={pages,i:0,n:0,cb:cb||null};
}
const TALK={
  archivist(){
    if(nKeys()>=3)return["You carry all three keystones. The tunnel mouth is on Church Hill, north and east of here. Go steady."];
    return["Fog off the James, and lamps dying block by block. Something woke under Church Hill.",
      "The old train tunnel caved in back in 1925. Three keystones hold its seal.",
      "Granite in the Belle Isle quarry. Iron in the Hollywood Cemetery pyramid. Brick in the cellar of the Poe Museum in Shockoe.",
      "Bring all three to the tunnel and end this. Your paddle will have to do for a sword."];
  },
  brewer(){p.hp=p.max;sfx(660,.2,'triangle');return["Rough night? Ginger beer is on the house in Scott's Addition.","Hearts refilled."];},
  musician(){return["Those rental scooters have gone feral. Two good whacks stops one.","Folks say the squirrels in the Fan learned to fly. Watch for the pounce."];},
  shop(){
    if(st.got.hcShop)return["Enjoy the charm. Catch a show at the Byrd when the fog lifts."];
    if(st.coins>=12){st.coins-=12;st.got.hcShop=1;p.max+=2;p.hp=p.max;sfx(880,.3,'triangle');return["Sold! One heart charm, twelve coins.","Your hearts grew by one."];}
    return["Carytown special: a heart charm for 12 coins. You have "+st.coins+"."];
  },
  keeper(){return["They say a pale thing crawled out of the tunnel collapse and ran here to hide among the tombs.","The ghosts keep the iron keystone inside the granite pyramid. Mind them."];},
  kayaker(){return["The quarry is in the rocks on the east side of the island.","River crabs only scuttle sideways. Come at them from above or below."];}
};

/* ---------- collision & movement ---------- */
function tileAt(px,py){const tx=Math.floor(px/TS),ty=Math.floor(py/TS);if(tx<0||ty<0||tx>=COLS||ty>=ROWS)return null;return cur.g[ty][tx];}
function blocked(x,y,h,oob){
  for(let i=0;i<4;i++){const t=tileAt(x+(i&1?h:-h),y+(i&2?h:-h));if(t===null){if(oob)return true;}else if(SOLID.includes(t))return true;}
  return false;
}
function npcHit(x,y){for(const n of cur.npcs||[])if(Math.abs(n.tx*TS+8-x)<11&&Math.abs(n.ty*TS+8-y)<11)return true;return false;}
function moveP(dx,dy){
  if(dx&&!blocked(p.x+dx,p.y,5,false)&&!npcHit(p.x+dx,p.y))p.x+=dx;
  if(dy&&!blocked(p.x,p.y+dy,5,false)&&!npcHit(p.x,p.y+dy))p.y+=dy;
}
function moveE(e,dx,dy){
  let ok=true;
  if(dx){if(!blocked(e.x+dx,e.y,5,true))e.x+=dx;else ok=false;}
  if(dy){if(!blocked(e.x,e.y+dy,5,true))e.y+=dy;else ok=false;}
  return ok;
}
function hurt(d,sx,sy){
  if(p.inv>0)return;
  p.hp-=d;p.inv=50;const dx=p.x-sx,dy=p.y-sy,l=Math.hypot(dx,dy)||1;p.kx=dx/l*2.5;p.ky=dy/l*2.5;p.kt=8;p.atk=0;sfx(140,.18,'sawtooth');
  burst(p.x,p.y-4,6,['#e83048','#ffffff'],1.6,2);
  if(p.hp<=0){p.hp=0;say(["The fog takes you...","You wake by the fountain in Capitol Square."],()=>{p.hp=p.max;p.x=136;p.y=120;p.dir=0;p.kt=0;load('2,1');});}
}
function shoot(e,sp0,a){shots.push({x:e.x,y:e.y,vx:Math.cos(a)*sp0,vy:Math.sin(a)*sp0,life:160,k:e.type});sfx(520,.06);}

/* ---------- enemies ---------- */
function updEnemy(e){
  if(e.flash>0)e.flash--;
  if(e.kt>0){e.kt--;if(FLY[e.type]){e.x+=e.kx;e.y+=e.ky;}else moveE(e,e.kx,e.ky);return;}
  e.t++;
  const dx=p.x-e.x,dy=p.y-e.y,d=Math.hypot(dx,dy)||1;let a;
  switch(e.type){
    case'rat':if(e.t%45==1||e.stuck){a=rnd(4);e.vx=DX[a]*.8;e.vy=DY[a]*.8;}e.stuck=!moveE(e,e.vx,e.vy);break;
    case'squirrel':{const ph=e.t%70;if(ph==40){e.vx=dx/d*1.7;e.vy=dy/d*1.7;}if(ph>=40&&ph<62)moveE(e,e.vx,e.vy);else e.vx=dx;break;}
    case'goose':if(d<70){e.vx=dx/d*.75;e.vy=dy/d*.75;moveE(e,e.vx,e.vy);}
      else{if(e.t%60==1||e.stuck){a=rnd(4);e.vx=DX[a]*.4;e.vy=DY[a]*.4;}e.stuck=!moveE(e,e.vx,e.vy);}break;
    case'scooter':if((!e.vx&&!e.vy)||e.stuck||Math.random()<.01){a=rnd(4);e.vx=DX[a]*1.4;e.vy=DY[a]*1.4;}e.stuck=!moveE(e,e.vx,e.vy);break;
    case'crab':if(e.t%60==1||e.stuck){e.vx=(Math.random()<.5?-1:1)*1.2;e.vy=Math.random()<.3?(dy>0?.4:-.4):0;}e.stuck=!moveE(e,e.vx,e.vy);break;
    case'bat':e.x+=dx/d*.6+Math.cos(e.t/9)*.8;e.y+=dy/d*.6+Math.sin(e.t/7)*.8;e.vx=dx;break;
    case'ghost':e.x+=dx/d*.4;e.y+=dy/d*.4;e.vx=dx;break;
    case'raven':{const ph=e.t%120;
      if(ph<70){const tx=p.x-e.x,ty=clamp(p.y-50,20,PH)-e.y,l=Math.hypot(tx,ty)||1;if(l>2){e.x+=tx/l*.7;e.y+=ty/l*.7;}e.vx=dx;if(ph==35)shoot(e,1.6,Math.atan2(dy,dx));}
      else{if(ph==70){e.vx=dx/d*2.2;e.vy=dy/d*2.2;sfx(300,.15,'sawtooth');}e.x+=e.vx;e.y+=e.vy;}break;}
    case'vampire':{const ph=e.t%170;e.gone=ph>=130;e.vx=dx;
      if(ph==0){for(let i=0;i<30;i++){const x=(2+rnd(12))*TS+8,y=(2+rnd(6))*TS+8;if(!blocked(x,y,6,true)&&Math.hypot(x-p.x,y-p.y)>50){e.x=x;e.y=y;break;}}sfx(200,.25,'triangle');burst(e.x,e.y-6,10,['#6c4c9e','#e83048'],1.4,2);}
      if(ph==40||ph==80||(e.hp<=7&&ph==110)){const b=Math.atan2(p.y-e.y,p.x-e.x),sp0=e.hp<=7?1.9:1.5;for(const o of[-.4,0,.4])shoot(e,sp0,b+o);}
      if(ph==100&&enemies.filter(q=>q.type=='bat').length<2)enemies.push(mk('bat',e.x,e.y-10));
      break;}
  }
  if(FLY[e.type]){e.x=clamp(e.x,12,W-12);e.y=clamp(e.y,14,PH-12);}
  if(e.vx)e.f=e.vx<0?-1:1;
}
function kill(e){
  st.kills++;sfx(90,.2,'sawtooth',.06);burst(e.x,e.y-2,e.boss?22:10,['#ffffff','#d8d8e8','#a8a8c0'],e.boss?2.2:1.3,3);
  if(e.type=='vampire'){enemies=[];shots=[];st.cleared[curId]=1;
    say(["The pale thing shrieks and comes apart like wet newspaper.","Above you the fog thins. One by one the lamps along Broad Street come back on.","Richmond is safe. Somebody owes you a ginger beer."],()=>{mode='win';winT=0;});return;}
  if(!e.boss){const r=Math.random();if(r<.32)picks.push({x:e.x,y:e.y,kind:'coin',life:600});else if(r<.48)picks.push({x:e.x,y:e.y,kind:'heart',life:600});}
  else for(let i=0;i<5;i++)picks.push({x:e.x-16+i*8,y:e.y+8,kind:'coin',life:900});
}

/* ---------- update ---------- */
function update(){
  frame++;if(fade>0)fade--;
  if(mode=='title'){if(action){reset();mode='play';sfx(660,.15,'triangle');}action=false;return;}
  if(mode=='win'){winT++;if(action&&winT>60){mode='title';}action=false;return;}
  if(trans){trans.t++;if(trans.t>=20)trans=null;action=false;return;}
  if(dlg){
    const tot=dlg.pages[dlg.i].join('').length;
    if(dlg.n<tot){dlg.n+=1;if(dlg.n%3==0)sfx(520,.02,'square',.015);}
    if(action){if(dlg.n<tot)dlg.n=tot;else{dlg.i++;dlg.n=0;sfx(700,.03);if(dlg.i>=dlg.pages.length){const cb=dlg.cb;dlg=null;if(cb)cb();}}}
    action=false;return;}
  for(let i=parts.length-1;i>=0;i--){const q=parts[i];q.x+=q.vx;q.y+=q.vy;q.vx*=.9;q.vy*=.9;if(--q.life<=0)parts.splice(i,1);}
  if(p.inv>0)p.inv--;
  if(p.kt>0){p.kt--;moveP(p.kx,p.ky);}
  else if(p.atk>0)p.atk--;
  else{
    const dx=keys.right-keys.left,dy=keys.down-keys.up;
    if(dx||dy){
      if(dx&&!dy)p.dir=dx>0?3:1;else if(dy&&!dx)p.dir=dy>0?0:2;
      else if(!((p.dir==3&&dx>0)||(p.dir==1&&dx<0)||(p.dir==0&&dy>0)||(p.dir==2&&dy<0)))p.dir=dx>0?3:1;
      const l=Math.hypot(dx,dy);moveP(dx/l*1.3,dy/l*1.3);p.moving=true;
    }else p.moving=false;
    if(action){
      const fx=p.x+DX[p.dir]*14,fy=p.y+DY[p.dir]*14;let n=null;
      for(const q of cur.npcs||[])if(Math.abs(q.tx*TS+8-fx)<13&&Math.abs(q.ty*TS+8-fy)<13)n=q;
      if(n){sfx(700,.03);say(TALK[n.talk]());}else{p.atk=14;sfx(420,.05);}
    }
  }
  action=false;
  if(dlg)return;
  // paddle
  if(p.atk>5){
    const hx=p.x+DX[p.dir]*12,hy=p.y+DY[p.dir]*12;
    for(const e of enemies.slice()){
      if(e.gone||e.flash>0)continue;const r=e.boss?14:11;
      if(Math.abs(e.x-hx)<r&&Math.abs(e.y-hy)<r){e.hp--;e.flash=16;e.kx=DX[p.dir]*2.5;e.ky=DY[p.dir]*2.5;e.kt=e.boss?3:8;sfx(240,.06);
        burst((e.x+hx)/2,(e.y+hy)/2,5,['#ffffff','#fff2a8'],1.8,2);
        if(e.hp<=0){enemies.splice(enemies.indexOf(e),1);kill(e);if(dlg||mode!='play')return;}}
    }
    for(let i=shots.length-1;i>=0;i--)if(Math.abs(shots[i].x-hx)<10&&Math.abs(shots[i].y-hy)<10){burst(shots[i].x,shots[i].y,4,['#ffffff'],1.2,2);shots.splice(i,1);sfx(900,.04);}
  }
  for(const e of enemies.slice())updEnemy(e);
  for(const e of enemies){if(e.gone)continue;const r=e.boss?11:9;if(Math.abs(e.x-p.x)<r&&Math.abs(e.y-p.y)<r){hurt(e.type=='vampire'?2:1,e.x,e.y);if(dlg)return;}}
  for(let i=shots.length-1;i>=0;i--){const s=shots[i];s.x+=s.vx;s.y+=s.vy;s.life--;
    if(s.life<=0||s.x<0||s.y<0||s.x>W||s.y>PH){shots.splice(i,1);continue;}
    if(Math.abs(s.x-p.x)<7&&Math.abs(s.y-p.y)<7){shots.splice(i,1);hurt(1,s.x,s.y);if(dlg)return;}}
  for(let i=picks.length-1;i>=0;i--){const k=picks[i];k.life--;
    if(k.life<=0){picks.splice(i,1);continue;}
    if(Math.abs(k.x-p.x)<10&&Math.abs(k.y-p.y)<10){picks.splice(i,1);
      if(k.kind=='coin'){st.coins++;sfx(1200,.05);burst(k.x,k.y,3,['#fff2a8'],1,1);}
      else if(k.kind=='heart'){p.hp=Math.min(p.max,p.hp+2);sfx(800,.1,'triangle');}
      else if(k.kind=='container'){st.got[k.id]=1;p.max+=2;p.hp=p.max;sfx(880,.3,'triangle');say(["A heart charm! Your hearts grew by one."]);return;}
      else if(k.kind=='keystone'){st.got[k.id]=1;sfx(990,.4,'triangle');const n=nKeys();
        say(["You found the "+KEYNAME[k.id]+" Keystone! ("+n+" of 3)",n>=3?"All three hum together. The tunnel on Church Hill is waiting.":"Step back onto the stairs to leave."]);return;}
    }}
  if(cur.interior&&!st.cleared[curId]&&enemies.length==0){st.cleared[curId]=1;sfx(660,.3,'triangle');if(cur.reward){picks.push({x:128,y:88,kind:'keystone',id:cur.reward,life:1e9});burst(128,88,14,['#ffffff','#fff2a8'],2,2);}}
  // doors, stairs, screen edges
  const t=tileAt(p.x,p.y);
  if(t=='D'){
    if(cur.door=='tunnel'&&nKeys()<3){p.y=cur.ret[1]*TS+8;p.x=cur.ret[0]*TS+8;say(["The tunnel mouth is sealed. Three hollows in the stone wait for keystones. You have "+nKeys()+"."]);}
    else{st.ret=[curId,cur.ret[0],cur.ret[1]];load(cur.door);p.x=128;p.y=8*TS+6;p.dir=2;
      if(curId=='tunnel'&&!st.cleared.tunnel)say(["The keystones crumble and the seal splits. Cold air breathes out of the dark.","Something tall stands on the buried rails."]);}
  }else if(t=='E'&&st.ret){const r=st.ret;load(r[0]);p.x=r[1]*TS+8;p.y=r[2]*TS+8;p.dir=0;}
  else if(!cur.interior){
    let nx=cur.mx,ny=cur.my,ox=p.x,oy=p.y;
    if(p.x<3){nx--;p.x=W-8;}else if(p.x>W-3){nx++;p.x=8;}else if(p.y<3){ny--;p.y=PH-8;}else if(p.y>PH-3){ny++;p.y=8;}
    if(nx!=cur.mx||ny!=cur.my){
      if(SC[nx+','+ny]){const old=cur.cv[(frame>>4)&3],dx=nx-cur.mx,dy=ny-cur.my;load(nx+','+ny);fade=0;trans={old,dx,dy,t:0};}
      else{p.x=clamp(ox,8,W-8);p.y=clamp(oy,8,PH-8);}}
  }
}

/* ---------- tile art ---------- */
function R(x,y,w,h,c){g.fillStyle=c;g.fillRect(x,y,w,h);}
function grass(x,y,h){
  R(x,y,16,16,'#58a848');
  for(let i=0;i<4;i++){const q=HH(h,i,7);R(x+q%13,y+(q>>4)%14,2+(q>>8)%3,1+(q>>11)%2,i&1?'#4c9a40':'#68b854');}
  if(h%3==0){const a=x+2+(h>>3)%10,b=y+4+(h>>7)%9;R(a,b,1,1,'#2f7a38');R(a+1,b-1,1,2,'#2f7a38');R(a+2,b,1,1,'#2f7a38');R(a+1,b-2,1,1,'#84cc68');}
}
function flowers(x,y,h){
  grass(x,y,h+1);const cs=['#f8e060','#f08098','#ffffff','#b890f8'];
  for(let i=0;i<4;i++){const q=HH(h,i,3),a=x+1+(i&1)*8+q%5,b=y+1+(i>>1)*8+(q>>3)%5;R(a,b+2,1,2,'#2f7a38');R(a-1,b,3,2,cs[(q>>6)%4]);R(a,b-1,1,1,cs[(q>>6)%4]);R(a,b,1,1,'#f8a030');}
}
function cobble(x,y,h){
  R(x,y,16,16,'#5e5450');const tn=['#9a8e88','#a89c94','#8a7e78'],hi=['#b4a8a0','#c2b6ae','#a4988f'];
  for(let r=0;r<4;r++){const segs=r&1?[[0,4],[4,8],[12,4]]:[[0,8],[8,8]];
    segs.forEach((sg,i)=>{const q=HH(h,r,(r&1&&i==2)?0:i)%3;R(x+sg[0],y+r*4,sg[1]-1,3,tn[q]);R(x+sg[0],y+r*4,sg[1]-1,1,hi[q]);});}
}
function sidewalk(x,y,h){
  R(x,y,16,16,'#c4bcae');R(x,y,16,1,'#dad2c4');R(x,y,1,16,'#dad2c4');R(x,y+15,16,1,'#a39b8d');R(x+15,y,1,16,'#a39b8d');
  for(let i=0;i<3;i++){const q=HH(h,i,9);R(x+2+q%12,y+2+(q>>4)%12,1,1,i?'#b0a898':'#d4ccbe');}
  if(h%7==0){R(x+5,y+6,3,1,'#a39b8d');R(x+8,y+7,2,1,'#a39b8d');R(x+10,y+8,1,2,'#a39b8d');}
}
function sand(x,y,h){
  R(x,y,16,16,'#e2cf96');
  for(let i=0;i<7;i++){const q=HH(h,i,5);R(x+q%15,y+(q>>4)%15,1+(q>>9)%2,1,i&1?'#cdb97c':'#f4e8ba');}
  if(h%6==0){R(x+9,y+9,3,2,'#f8f0e0');R(x+9,y+11,3,1,'#c8b890');}
}
function floor(s,x,y,h){
  const f=s.fl||['#4a4458','#38324a','#5c566c'];R(x,y,16,16,f[0]);
  if(s.wood){for(let i=0;i<16;i+=4){R(x,y+i+3,16,1,f[1]);R(x,y+i,16,1,f[2]);}R(x+(h%2?4:11),y,1,16,f[1]);R(x+3+h%9,y+5,2,1,f[1]);}
  else{R(x,y,16,1,f[2]);R(x,y,1,16,f[2]);R(x,y+15,16,1,f[1]);R(x+15,y,1,16,f[1]);
    for(let i=0;i<3;i++){const q=HH(h,i,2);R(x+2+q%12,y+2+(q>>4)%12,1+(q>>8)%2,1,i?f[1]:f[2]);}
    if(h%5==0){R(x+4,y+9,2,1,f[1]);R(x+6,y+10,3,1,f[1]);R(x+8,y+11,1,2,f[1]);}}
}
function ground(s,ch,x,y,h){
  if(ch==',')flowers(x,y,h);else if(ch=='p')cobble(x,y,h);else if(ch=='s')sidewalk(x,y,h);else if(ch=='n')sand(x,y,h);else if(ch=='F')floor(s,x,y,h);else grass(x,y,h);
}
const BLOB=[6,10,12,14,14,14,14,14,12,12,10,6];
function blob(x,y,mid,dark,out){
  BLOB.forEach((w,i)=>{const a=x+8-w/2;R(a,y+i,w,1,mid);R(a,y+i,1,1,out);R(a+w-1,y+i,1,1,out);});
  R(x+5,y,6,1,out);R(x+5,y+11,6,1,out);
  R(x+8,y+8,5,2,dark);R(x+10,y+6,3,2,dark);R(x+6,y+9,3,1,dark);
}
function facade(s,x,y,h,tx,ty,roofAbove,plain){
  const pl=s.pal||[BRICK],c=pl[(tx+(ty>5?3:0))%pl.length];
  R(x,y,16,16,c[0]);
  for(let r=0;r<4;r++){R(x,y+r*4+3,16,1,c[1]);const o=r&1?4:0;R(x+o,y+r*4,1,3,c[1]);R(x+o+8,y+r*4,1,3,c[1]);
    const q=HH(h,r,4);if(q%3==0)R(x+((o+1+(q>>3)%2*8)%16),y+r*4,7,3,c[2]);}
  R(x+15,y,1,16,c[1]);R(x,y,1,16,c[2]);
  if(roofAbove)R(x,y,16,2,'rgba(10,8,24,.4)');else{R(x,y,16,2,'#efe4c8');R(x,y+2,16,1,'#8a7a60');R(x,y,16,1,'#fffaf0');}
  if(plain)return;
  const ft=h%4;

let texts=[];

function drawPaddle(){

function drawPlayer(){
  shadow(p.x,p.y+4,5);

  const d=p.dir,set=d==0?HERO.down:d==2?HERO.up:HERO.side,wk=p.moving?(frame>>3)&3:0;
  let s;

  else{const fr=set[wk&1];s=d==3?fr.r:fr.l;}
  if(p.atk>0&&d==2)drawPaddle();
  D(s,p.x-8,p.y-11-((wk&1)?1:0));

function drawEnemy(e){

    case'ghost':shadow(e.x,e.y+9,4);g.globalAlpha=.8;D(SPR.ghost[sd],e.x-8,e.y-9+Math.sin((frame+e.t)/12)*2,wh);g.globalAlpha=1;break;

const SKY=['#0c1030','#141a44','#22245a','#3a2a66','#6a3a6e','#a8505e','#e08a58'];

const KEYMAP={ArrowUp:'up',ArrowDown:'down',ArrowLeft:'left',ArrowRight:'right',w:'up',s:'down',a:'left',d:'right',W:'up',S:'down',A:'left',D:'right'};
addEventListener('keydown',e=>{wake();const k=KEYMAP[e.key];if(k){keys[k]=1;e.preventDefault();}

addEventListener('keyup',e=>{const k=KEYMAP[e.key];if(k)keys[k]=0;});

const pad=document.getElementById('pad'),knob=document.getElementById('knob'),act=document.getElementById('act');
function padMove(e){
  const r=pad.getBoundingClientRect(),dx=e.clientX-(r.left+r.width/2),dy=e.clientY-(r.top+r.height/2),m=Math.hypot(dx,dy);
  keys.up=keys.down=keys.left=keys.right=0;
  if(m>r.width*.1){const ax=dx/m,ay=dy/m;if(ax>.38)keys.right=1;if(ax<-.38)keys.left=1;if(ay>.38)keys.down=1;if(ay<-.38)keys.up=1;}
  const c=Math.min(m,r.width*.3)/(m||1);knob.style.transform='translate('+dx*c+'px,'+dy*c+'px)';
}
function padEnd(){keys.up=keys.down=keys.left=keys.right=0;knob.style.transform='';}
pad.addEventListener('pointerdown',e=>{wake();try{pad.setPointerCapture(e.pointerId);}catch(_){ }padMove(e);e.preventDefault();});

pad.addEventListener('pointerup',padEnd);pad.addEventListener('pointercancel',padEnd);
act.addEventListener('pointerdown',e=>{wake();action=true;act.classList.add('on');e.preventDefault();});

/* ---------- loop ---------- */
reset();
let last=0,acc=0,paused=false;
function loop(t){
  if(!paused){acc+=Math.min(100,t-last);while(acc>=16.6){update();acc-=16.6;}draw();}
  last=t;requestAnimationFrame(loop);
}
if(document.fonts&&document.fonts.load)document.fonts.load('8px "Press Start 2P"').catch(()=>{});
requestAnimationFrame(t=>{last=t;loop(t);});
