<style>
:root{
  /* Layout: one screen. Slim masthead, game canvas fills the middle, thumb controls along the bottom. */
  --night:#12141c;      /* page ground: fog at night */
  --slate:#1e2230;      /* raised surfaces */
  --fog:#aeb7c2;        /* body text */
  --brick:#9a4b38;      /* Richmond brick: the A button */
  --river:#3f7f96;      /* the James: the B button */
  --lamp:#f2c14e;       /* gaslight accent */
  --display:"Press Start 2P", ui-monospace, Menlo, monospace;
  --body:"Barlow Semi Condensed", system-ui, sans-serif;
  color-scheme:dark;
}
*{box-sizing:border-box}
html,body{height:100%;margin:0}
body{background:var(--night);color:var(--fog);font-family:var(--body);display:flex;flex-direction:column;overflow:hidden;
  -webkit-user-select:none;user-select:none;-webkit-touch-callout:none;touch-action:none}
header{display:flex;align-items:center;justify-content:space-between;gap:12px;padding:8px 16px;border-bottom:2px solid var(--slate)}
h1{font-family:var(--display);font-size:11px;letter-spacing:.5px;margin:0;color:var(--lamp);font-weight:400;white-space:nowrap}
header p{margin:0;font-size:14px;font-weight:500;white-space:nowrap;overflow:hidden;text-overflow:ellipsis;display:none}
#menu{font-family:var(--display);font-size:9px;color:var(--fog);background:var(--slate);border:2px solid #2c3246;border-radius:14px;padding:8px 14px;touch-action:none;flex:none}
#menu:focus-visible,.btn:focus-visible{outline:3px solid var(--lamp);outline-offset:3px}
#stage{flex:1;min-height:0;display:flex;align-items:center;justify-content:center;padding:8px 16px}
canvas{display:block;max-width:100%;max-height:100%;image-rendering:pixelated;border:3px solid var(--slate);border-radius:4px;background:#000;touch-action:none}
#controls{display:flex;align-items:center;justify-content:space-between;padding:4px 18px 20px;gap:12px}
#pad{position:relative;width:132px;height:132px;border-radius:50%;background:var(--slate);border:2px solid #2c3246;touch-action:none;flex:none}
#pad i{position:absolute;width:0;height:0;border:9px solid transparent;opacity:.75}
#pad .u{left:50%;top:13px;margin-left:-9px;border-bottom-color:var(--fog);border-top-width:0}
#pad .d{left:50%;bottom:13px;margin-left:-9px;border-top-color:var(--fog);border-bottom-width:0}
#pad .l{top:50%;left:13px;margin-top:-9px;border-right-color:var(--fog);border-left-width:0}
#pad .r{top:50%;right:13px;margin-top:-9px;border-left-color:var(--fog);border-right-width:0}
#knob{position:absolute;left:50%;top:50%;width:44px;height:44px;margin:-22px 0 0 -22px;border-radius:50%;background:#394058;pointer-events:none}
#btns{position:relative;width:156px;height:124px;flex:none}
.btn{position:absolute;border-radius:50%;border:0;color:#fff;font-family:var(--display);line-height:1.5;touch-action:none}
#act{right:0;top:0;width:84px;height:84px;background:var(--brick);box-shadow:0 5px 0 #6c3020;font-size:15px}
#bbtn{left:0;bottom:4px;width:66px;height:66px;background:var(--river);box-shadow:0 5px 0 #26566a;font-size:13px}
.btn small{display:block;font-size:7px;opacity:.85}
.btn:active,.btn.on{transform:translateY(3px)}
@media (hover:hover) and (pointer:fine){
  #controls,#menu{display:none}
  header p{display:block}
  #stage{padding-bottom:16px}
}
</style>
</head>
<body>
<header>
  <h1>River City Quest</h1>
  <p>Arrows or WASD move. Z or Space: A (swing, talk, read; hold for a spin). X: B (item). Enter: menu.</p>
  <button id="menu" type="button" aria-label="Open the inventory menu">MENU</button>
</header>
<div id="stage"><canvas id="game" width="768" height="600" aria-label="River City Quest game screen"></canvas></div>
<div id="controls">
  <div id="pad" aria-label="Direction pad"><i class="u"></i><i class="d"></i><i class="l"></i><i class="r"></i><div id="knob"></div></div>
  <div id="btns">
    <button id="bbtn" class="btn" type="button" aria-label="Use the item on B">B<small>ITEM</small></button>
    <button id="act" class="btn" type="button" aria-label="Swing paddle, talk or read">A<small>PADDLE</small></button>
  </div>
</div>

/* ---------- Richmond lore: the journal ---------- */
const LORE=[
['names',`Named for a View`,`Richmond was laid out in 1737. The story goes that William Byrd II looked out from Church Hill at the bend in the James and thought of the view of the Thames from Richmond Hill in England, so he named the town Richmond.`],
['stjohns',`St. John's Church`,`In March 1775 the Second Virginia Convention met inside this white wooden church. Patrick Henry ended his speech here with "Give me liberty, or give me death!" Reenactors still perform it in the church.`],
['eliza',`Eliza Poe's Grave`,`Edgar Allan Poe's mother, the actress Eliza Poe, died in Richmond in December 1811, when Edgar was two. She is buried here in St. John's churchyard.`],
['tunnel',`The Church Hill Tunnel`,`On October 2, 1925, the railroad tunnel under Church Hill caved in on a work train. Engineer Thomas Mason died at the controls. Fireman Benjamin Mosby crawled out badly scalded and died hours later. Laborers Richard Lewis and H. Smith were never found. Engine 231 and ten flat cars are still sealed inside.`],
['vampire',`The Richmond Vampire`,`A legend grew out of the collapse: a pale, bloody figure crawled from the tunnel and fled to a tomb in Hollywood Cemetery. The real story is sadder. The figure people remembered was most likely fireman Benjamin Mosby, burned by steam from the boiler.`],
['capitol',`A Temple for a Capitol`,`Thomas Jefferson modeled the Virginia State Capitol on the Maison Carree, an ancient Roman temple in Nimes, France. The legislature first met in it in 1788.`],
['capital1780',`Capital Since 1780`,`Virginia's government moved here from Williamsburg in 1780. Richmond was closer to the middle of the state and farther from British ships along the coast.`],
['houdon',`Houdon's Washington`,`The marble George Washington in the rotunda is by the French sculptor Jean-Antoine Houdon. He made a life mask of Washington at Mount Vernon in 1785, and many call this the truest likeness of him.`],
['civilrights',`Civil Rights Memorial`,`Unveiled in 2008, this memorial honors 16-year-old Barbara Johns and her classmates at Moton High School in Farmville, who walked out in 1951 to protest their run-down school. Their case became part of Brown v. Board of Education.`],
['jward',`Harlem of the South`,`In the early 1900s Jackson Ward was a center of Black business and culture, full of banks, insurance companies, churches and theaters. Second Street, called the Deuce, drew touring jazz stars to its clubs.`],
['walker',`St. Luke Penny Savings`,`Maggie L. Walker opened the St. Luke Penny Savings Bank in Jackson Ward in 1903, becoming the first woman to charter a bank in the United States. She urged neighbors to save even pennies to buy homes and start businesses.`],
['bojangles',`Bojangles' Traffic Light`,`Tap dancer Bill "Bojangles" Robinson was born in Jackson Ward in 1878. In 1933 he saw children struggling to cross Leigh Street at Adams and paid for a traffic light there himself. A statue of him, mid-dance, has stood beside it since 1973.`],
['streetcar',`First Electric Streetcars`,`In 1888 Frank Sprague's electric streetcars began running in Richmond, the first large electric street railway in the world that really worked. Cities across the country soon copied it.`],
['broad',`Department Store Row`,`For most of the 1900s, Miller & Rhoads and Thalhimers faced each other on Broad Street. Families came downtown to shop, eat in the Miller & Rhoads Tea Room and visit its famous Santa.`],
['scotts',`Scott's Addition`,`This old district of factories and warehouses became Richmond's brewery and cidery row in the 2010s. The Diamond, home of the city's minor league baseball, sits at its edge.`],
['diamond',`Baseball on the Boulevard`,`Richmond's minor league teams have played at The Diamond since 1985. Today's team, the Flying Squirrels, is named for a little animal that glides between trees.`],
['carytown',`Carytown`,`Carytown is a long stretch of West Cary Street packed with small shops and restaurants. Every summer it fills up for a giant watermelon festival.`],
['byrd',`The Byrd Theatre`,`The Byrd opened in 1928 and still shows movies under its huge crystal chandelier. On Saturday nights an organist rises out of the pit playing the Mighty Wurlitzer before the show.`],
['fan',`Why It's Called the Fan`,`The streets here spread west from Monroe Park like the ribs of a folding fan. Its blocks of row houses are often called the largest intact Victorian neighborhood in the country.`],
['ashe',`Arthur Ashe`,`Arthur Ashe was born in Richmond in 1943 and learned tennis at the park where his father was caretaker. In 1975 he became the first Black man to win Wimbledon. His statue went up on Monument Avenue in 1996.`],
['k10',`Monument Avenue 10K`,`Every spring, tens of thousands of runners crowd Monument Avenue for the Monument Avenue 10K, one of the largest 10K races in the country.`],
['maymont',`Maymont`,`James and Sallie Dooley built this Gilded Age estate in the 1890s. When Sallie died in 1925 she left it to the city. It became a public park with Japanese and Italian gardens and native wildlife.`],
['hollywood',`Hollywood Cemetery`,`Named for the holly trees on its hills, Hollywood Cemetery opened in 1849. Presidents James Monroe and John Tyler are buried here. Monroe's tomb sits inside a Gothic cast-iron cage people call the birdcage.`],
['pyramid',`The Granite Pyramid`,`This 90-foot pyramid was raised in 1869 as a memorial to the Confederate soldiers buried in the cemetery. Its James River granite blocks were stacked without any mortar.`],
['irondog',`The Iron Dog`,`A cast-iron Newfoundland dog guards the grave of Florence Rees, who died of scarlet fever in 1862 at age two. The best-known story says the dog was moved here so it would not be melted down for bullets during the Civil War.`],
['falls',`The Falls of the James`,`Richmond sits on the fall line, where the James tumbles over rocks before it becomes a tidal river. English explorers led by Christopher Newport reached these falls in 1607, near a town of the Powhatan people.`],
['belleisle',`Belle Isle`,`Over the years this island has been a fishery, a granite quarry, a Civil War prison camp for captured Union soldiers, a nail factory and a power plant. Today it is a park, reached by a footbridge hung under a highway bridge.`],
['quarry',`The Quarry Pond`,`Quarrymen blasted Belle Isle's granite loose with black powder and cut it into blocks for buildings across Richmond. When the digging stopped, the pit filled with water and became a pond.`],
['tredegar',`Tredegar Iron Works`,`Across the canal from Belle Isle, Tredegar Iron Works cast cannon, rails and locomotives. Its old buildings now house the American Civil War Museum.`],
['rocketts',`Rocketts Landing`,`For two centuries Rocketts was Richmond's port, as far up the James as ships could sail. On April 4, 1865, Abraham Lincoln stepped ashore here and walked into the city.`],
['trail',`Virginia Capital Trail`,`This paved trail runs about 52 miles along the James from Richmond to Jamestown, linking Virginia's capital today with its first one.`],
['shockoe',`Shockoe Bottom`,`Richmond's oldest business district grew up along Shockoe Creek. Main Street Station, with its tall clock tower, opened here in 1901.`],
['slavetrail',`The Richmond Slave Trail`,`Before the Civil War, Shockoe Bottom held one of the largest slave markets in the United States. Lumpkin's Jail stood a few blocks from here. The Richmond Slave Trail marks the route enslaved people were forced to walk, so that they are remembered.`],
['stonehouse',`The Old Stone House`,`The Poe Museum's Old Stone House dates to the mid-1700s and is the oldest house still standing in Richmond. In 1824 a 15-year-old Edgar Allan Poe stood in an honor guard outside it when Lafayette came to visit.`],
['poe',`Poe in Richmond`,`Edgar Allan Poe grew up in Richmond and later edited the Southern Literary Messenger here. As a teenager he swam about six miles of the James against the tide, a feat he was proud of all his life.`],
['goldbugtale',`The Gold-Bug`,`Poe's 1843 story "The Gold-Bug" follows a man who cracks a secret code to find Captain Kidd's buried treasure. It was one of his most popular stories while he was alive.`],
];

const OPP={N:'S',S:'N',E:'W',W:'E'};
function cellsFor(s,d){const c=[];
  if(d=='N'||d=='S'){const y=d=='N'?0:ROWS-1;for(let x=s.ow?6:7;x<=(s.ow?9:8);x++)c.push([x,y]);}
  else{const x=d=='W'?0:COLS-1;for(let y=4;y<=6;y++)c.push([x,y]);}
  return c;}
(function finalize(){
  for(const id in SC){const s=SC[id];s.opens=[];if(s.ow){if(s.ay>0)s.opens.push('N');if(s.ay<2)s.opens.push('S');if(s.ax>0)s.opens.push('W');if(s.ax<3)s.opens.push('E');}}
  for(const L of LINKS){const A=SC[L.a],B=SC[L.b];A.opens.push(L.dir);B.opens.push(OPP[L.dir]);
    if(L.type!='open'){const t={lock:'L',bomb:'%',gate:'H'}[L.type];
      for(const [Sx,d] of [[A,L.dir],[B,OPP[L.dir]]])Sx.dyn.push({cells:cellsFor(Sx,d),closed:t,open:Sx.base,flag:L.type=='gate'?null:'e:'+L.a+'>'+L.b,solved:L.type=='gate'?L.a:null});}}
  for(const id in SC){const s=SC[id],m=[];
    for(let y=0;y<ROWS;y++){m.push([]);for(let x=0;x<COLS;x++)m[y].push(x==0||y==0||x==COLS-1||y==ROWS-1?s.border:s.base);}
    for(const d of s.opens)for(const [x,y] of cellsFor(s,d))m[y][x]=s.base;
    if(s.entry)m[9][7]=m[9][8]='E';
    for(const [t,x,y,w=1,h=1] of s.feats)for(let yy=y;yy<y+h;yy++)for(let xx=x;xx<x+w;xx++)m[yy][xx]=t;
    s.g0=m;}
})();
const AREAB={};for(const id in SC){const s=SC[id],b=AREAB[s.area]||(AREAB[s.area]={x0:9,y0:9,x1:0,y1:0});b.x0=Math.min(b.x0,s.ax);b.y0=Math.min(b.y0,s.ay);b.x1=Math.max(b.x1,s.ax);b.y1=Math.max(b.y1,s.ay);}

function isSolved(s){if(!s)return false;if(s.solve=='lit')return(s.braz||[]).every((b,i)=>st.f['b:'+s.id+':'+i]);if(s.solve=='clear')return!!st.f['clr:'+s.id];return false;}
function applyDyn(s){
  s.g=s.g0.map(r=>r.slice());
  for(const d of s.dyn){const o=(d.flag&&st.f[d.flag])||(d.solved&&isSolved(SC[d.solved]));for(const [x,y] of d.cells)s.g[y][x]=o?d.open:d.closed;}
  (s.braz||[]).forEach(([x,y],i)=>s.g[y][x]=st.f['b:'+s.id+':'+i]?'J':'j');
  for(const c of s.chests||[]){if(st.f['c:'+c.id])s.g[c.ty][c.tx]='o';else if(!c.appear||isSolved(s))s.g[c.ty][c.tx]='c';}
  if(s.bossT&&st.f['boss:'+s.id])s.g[8][7]=s.g[8][8]='E';
}
function refresh(){applyDyn(cur);cur.torches=[];cur.cv=[0,1,2,3].map(f=>renderMap(cur,f));}
function load(id){
  cur=SC[id];curId=id;enemies=[];shots=[];picks=[];parts=[];bombs=[];bug=null;fade=10;
  refresh();
  for(const n of cur.npcs||[])if(!n.spr)n.spr=npcSpr(n);
  if(cur.ow)st.ow=[cur.ax,cur.ay];
  st.vis[id]=1;
  const done=cur.ow?false:cur.bossT?st.f['boss:'+id]:st.f['clr:'+id];
  if(!done)for(const [t,tx,ty] of cur.en)enemies.push(mk(t,tx*TS+8,ty*TS+8));
  for(const it of cur.items||[])if(!st.got[it.id])picks.push({x:it.px||it.tx*TS+8,y:it.py||it.ty*TS+8,kind:it.kind,id:it.id,life:1e9});
  if(cur.bossT&&st.f['boss:'+id]){if(cur.reward&&!st.got[cur.reward])picks.push({x:112,y:80,kind:'keystone',id:cur.reward,life:1e9});
    if(!st.got['hc:'+id]&&cur.bossT!='vampire')picks.push({x:144,y:80,kind:'container',id:'hc:'+id,life:1e9});}
  banner=cur.name;bannerT=100;needSave=true;
}

function sfx(f,d,type,v){if(!ac)return;try{const o=ac.createOscillator(),gn=ac.createGain();o.type=type||'square';o.frequency.value=f;
  gn.gain.value=v||.04;gn.gain.exponentialRampToValueAtTime(.0001,ac.currentTime+(d||.08));o.connect(gn);gn.connect(ac.destination);o.start();o.stop(ac.currentTime+(d||.08));}catch(e){}}
function tune(seq,type){if(!ac)return;try{let t=ac.currentTime;for(const [f,d] of seq){if(f){const o=ac.createOscillator(),gn=ac.createGain();o.type=type||'square';o.frequency.value=f;
  gn.gain.setValueAtTime(.045,t);gn.gain.exponentialRampToValueAtTime(.0001,t+d*.95);o.connect(gn);gn.connect(ac.destination);o.start(t);o.stop(t+d);}t+=d;}}catch(e){}}

function say(lines,cb,head){

/* ---------- collision & movement ---------- */
function tileAt(px,py){const tx=Math.floor(px/TS),ty=Math.floor(py/TS);if(tx<0||ty<0||tx>=COLS||ty>=ROWS)return null;return cur.g[ty][tx];}
function blockedPt(x,y,set){const t=tileAt(x,y);return t===null||set.includes(t);}
function blocked(x,y,h,oob){
  for(let i=0;i<4;i++){const t=tileAt(x+(i&1?h:-h),y+(i&2?h:-h));if(t===null){if(oob)return true;}else if(SOLID.includes(t))return true;}
  return false;
}
function npcAt(x,y){for(const n of cur.npcs||[])if(Math.abs(n.tx*TS+8-x)<13&&Math.abs(n.ty*TS+8-y)<13)return n;return null;}
function npcHit(x,y){for(const n of cur.npcs||[])if(Math.abs(n.tx*TS+8-x)<11&&Math.abs(n.ty*TS+8-y)<11)return true;return false;}
function moveP(dx,dy){
  if(dx&&!blocked(p.x+dx,p.y,5,false)&&!npcHit(p.x+dx,p.y))p.x+=dx;
  if(dy&&!blocked(p.x,p.y+dy,5,false)&&!npcHit(p.x,p.y+dy))p.y+=dy;
}
function moveE(e,dx,dy){
  let ok=true;
  if(dx){if(!blocked(e.x+dx,e.y,5,true))e.x+=dx;else ok=false;}
  if(dy){if(!blocked(e.x,e.y+dy,5,true))e.y+=dy;else ok=false;}
  return ok;
}
const front=d=>[p.x+DX[p.dir]*d,p.y+DY[p.dir]*d];
function hurt(d,sx,sy){
  if(p.inv>0||p.dash>0||p.hp<=0)return;
  p.hp-=d;p.inv=50;const dx=p.x-sx,dy=p.y-sy,l=Math.hypot(dx,dy)||1;p.kx=dx/l*2.5;p.ky=dy/l*2.5;p.kt=8;p.atk=0;p.charging=false;p.spin=0;sfx(140,.18,'sawtooth');
  burst(p.x,p.y-4,6,['#e83048','#ffffff'],1.6,2);
  if(p.hp<=0){p.hp=0;bug=null;
    say(['The fog takes you...',st.dent?'You come to at the entrance.':'You wake by the fountain in Capitol Square.'],()=>{
      p.hp=p.max;p.kt=0;p.inv=60;if(st.dent){load(st.dent);p.x=128;p.y=8*TS+6;p.dir=2;}else{load('ow:2,1');p.x=136;p.y=120;p.dir=0;}});}
}
function shoot(e,sp0,a,k){shots.push({x:e.x,y:e.y-4,vx:Math.cos(a)*sp0,vy:Math.sin(a)*sp0,life:200,k:k||e.type});sfx(520,.06);}

/* ---------- enemies ---------- */
function updEnemy(e){
  if(e.flash>0)e.flash--;
  if(e.kt>0){e.kt--;if(FLY[e.type]){e.x+=e.kx;e.y+=e.ky;}else moveE(e,e.kx,e.ky);return;}
  if(e.stun>0){e.stun--;return;}
  e.t++;
  const dx=p.x-e.x,dy=p.y-e.y,d=Math.hypot(dx,dy)||1;let a;
  switch(e.type){
    case'rat':if(e.t%45==1||e.stuck){a=rnd(4);e.vx=DX[a]*.8;e.vy=DY[a]*.8;}e.stuck=!moveE(e,e.vx,e.vy);break;
    case'squirrel':{const ph=e.t%70;if(ph==40){e.vx=dx/d*1.7;e.vy=dy/d*1.7;}if(ph>=40&&ph<62)moveE(e,e.vx,e.vy);else e.vx=dx;break;}
    case'goose':if(d<70){e.vx=dx/d*.75;e.vy=dy/d*.75;moveE(e,e.vx,e.vy);}
      else{if(e.t%60==1||e.stuck){a=rnd(4);e.vx=DX[a]*.4;e.vy=DY[a]*.4;}e.stuck=!moveE(e,e.vx,e.vy);}break;
    case'scooter':if((!e.vx&&!e.vy)||e.stuck||Math.random()<.01){a=rnd(4);e.vx=DX[a]*1.4;e.vy=DY[a]*1.4;}e.stuck=!moveE(e,e.vx,e.vy);break;
    case'crab':if(e.t%60==1||e.stuck){e.vx=(Math.random()<.5?-1:1)*1.2;e.vy=Math.random()<.3?(dy>0?.4:-.4):0;}e.stuck=!moveE(e,e.vx,e.vy);break;
    case'bat':e.x+=dx/d*.6+Math.cos(e.t/9)*.8;e.y+=dy/d*.6+Math.sin(e.t/7)*.8;e.vx=dx;break;
    case'ghost':e.x+=dx/d*.4;e.y+=dy/d*.4;e.vx=dx;break;
    case'raven':{const ph=e.t%120;
      if(ph<70){const tx=p.x-e.x,ty=clamp(p.y-50,20,PH)-e.y,l=Math.hypot(tx,ty)||1;if(l>2){e.x+=tx/l*.7;e.y+=ty/l*.7;}e.vx=dx;if(ph==35)shoot(e,1.6,Math.atan2(dy,dx),'feather');}
      else{if(ph==70){e.vx=dx/d*2.2;e.vy=dy/d*2.2;sfx(300,.15,'sawtooth');}e.x+=e.vx;e.y+=e.vy;}break;}
    case'vampire':{const ph=e.t%170;e.gone=ph>=130;e.vx=dx;
      if(ph==0){for(let i=0;i<30;i++){const x=(2+rnd(12))*TS+8,y=(3+rnd(6))*TS+8;if(!blocked(x,y,6,true)&&Math.hypot(x-p.x,y-p.y)>50){e.x=x;e.y=y;break;}}sfx(200,.25,'triangle');burst(e.x,e.y-6,10,['#6c4c9e','#e83048'],1.4,2);}
      if(ph==40||ph==80||(e.hp<=7&&ph==110)){const b=Math.atan2(p.y-e.y,p.x-e.x),s0=e.hp<=7?1.9:1.5;for(const o of[-.4,0,.4])shoot(e,s0,b+o,'blood');}
      if(ph==100&&enemies.filter(q=>q.type=='bat').length<2)enemies.push(mk('bat',e.x,e.y-10));
      break;}
    case'turtle':
      if(e.state=='stun'){if(--e.st<=0){e.state='walk';e.t=0;}break;}
      if(e.state=='wind'){if(--e.st<=0){e.state='charge';if(Math.abs(dx)>Math.abs(dy)){e.vx=Math.sign(dx)*2.6;e.vy=0;}else{e.vx=0;e.vy=Math.sign(dy)*2.6;}sfx(160,.2,'sawtooth');}break;}
      if(e.state=='charge'){if(!moveE(e,e.vx,e.vy)){e.state='stun';e.st=140;shake=10;sfx(70,.3,'sawtooth',.08);burst(e.x+Math.sign(e.vx)*10,e.y+Math.sign(e.vy)*10,10,['#8e909c','#5c5e6a'],1.8,2);}break;}
      if(e.t%40<30){const h=Math.abs(dx)>Math.abs(dy);moveE(e,h?Math.sign(dx)*.5:0,h?0:Math.sign(dy)*.5);}
      e.vx=dx;if(e.t>=100){e.state='wind';e.st=36;}
      break;
    case'wraith':
      if(e.vis>0){e.vis--;e.x+=Math.sin(e.t/6)*.3;e.vx=dx;break;}
      {const tx=clamp(p.x,40,W-40),ty=clamp(p.y-56,30,90);e.x+=(tx-e.x)*.02+Math.cos(e.t/20)*.5;e.y+=(ty-e.y)*.02;}
      if(e.t%110==60){shoot(e,1.4,Math.atan2(dy,dx),'orb');sfx(300,.2,'triangle');}
      if(e.t%330==200&&enemies.filter(q=>q.type=='ghost').length<2)enemies.push(mk('ghost',e.x,e.y));
      e.vx=dx;break;
  }
  if(FLY[e.type]){e.x=clamp(e.x,12,W-12);e.y=clamp(e.y,14,PH-12);}
  if(e.vx)e.f=e.vx<0?-1:1;
}
function hitEnemy(e,dmg,src,kx,ky){
  if(e.gone||e.flash>0)return false;
  if(e.type=='turtle'&&e.state!='stun'&&src!='bomb'){sfx(1500,.05,'square',.03);burst(e.x,e.y-6,3,['#ffffff'],1,1);return'clank';}
  if(e.type=='wraith'&&e.vis<=0){if(src!='refl')return false;e.vis=130;}
  e.hp-=dmg;e.flash=16;e.kx=kx||0;e.ky=ky||0;e.kt=e.boss?2:8;sfx(240,.06);
  burst(e.x,e.y-2,5,['#ffffff','#fff2a8'],1.8,2);
  if(e.hp<=0){const i=enemies.indexOf(e);if(i>=0)enemies.splice(i,1);kill(e);}
  return true;
}

  const r=Math.random();
  if(r<.3)picks.push({x:e.x,y:e.y,kind:'coin',life:600});
  else if(r<.44)picks.push({x:e.x,y:e.y,kind:'heart',life:600});

function collect(k){

/* ---------- actions ---------- */
function interact(){
  const [fx,fy]=front(14);
  let n=npcAt(fx,fy);
  if(!n&&tileAt(fx,fy)=='V'){const [gx,gy]=front(30);n=npcAt(gx,gy);}
  if(n){sfx(700,.03);const r=TALK[n.talk](n);if(r)say(r,null,n.who);return true;}
  const tx=Math.floor(fx/TS),ty=Math.floor(fy/TS),t=tileAt(fx,fy);
  if(t=='c'){const c=cur.chests.find(q=>q.tx==tx&&q.ty==ty);if(c){st.f['c:'+c.id]=1;refresh();say(give(c.item),null,'Treasure');}return true;}
  const r=cur.reads[tx+','+ty]||(cur.readsT&&cur.readsT[t]);
  if(r){if(r[0]=='!'){const x=READX[r];if(r=='!organ')tune(ORGAN,'triangle');say([x[1]],null,x[0]);}else{sfx(700,.03);say([LOREM[r].s],null,LOREM[r].t);learn(r);}return true;}
  if(t=='j'){say(['A cold brazier.',st.items.lantern?'Use the Gas Lantern on it with B. Pick it in the MENU if it isn\'t on B.':'Something would have to light it.']);return true;}
  if(t=='L'){tryUnlock(tx,ty,true);return true;}
  return false;
}
function tryUnlock(tx,ty,loud){
  if((st.keys[cur.area]||0)>0){const d=cur.dyn.find(q=>q.closed=='L'&&q.cells.some(([x,y])=>x==tx&&y==ty));if(!d)return;
    st.f[d.flag]=1;st.keys[cur.area]--;refresh();tune([[392,.06],[523,.06],[784,.12]]);toast('Unlocked!');needSave=true;}
  else if(loud)say(['Locked tight. A small key from somewhere in here would open it.']);
  else if(toastT<=0)toast('Locked. Find a small key.');
}
function lightAt(tx,ty){
  const i=(cur.braz||[]).findIndex(([x,y])=>x==tx&&y==ty);if(i<0)return;
  const was=isSolved(cur);st.f['b:'+cur.id+':'+i]=1;refresh();sfx(900,.1,'triangle');burst(tx*TS+8,ty*TS+4,10,['#f8e060','#f08020','#ffffff'],1.4,2);
  if(!was&&isSolved(cur)){tune(SECRET);toast((cur.chests||[]).length?'A chest appeared!':'Something opened nearby.');}needSave=true;
}
function useItem(){

  switch(id){
    case'lantern':{const [fx,fy]=front(14);if(tileAt(fx,fy)=='j')lightAt(Math.floor(fx/TS),Math.floor(fy/TS));

      else toast('The bottle is empty. The brewer refills it.');break;
  }

function explode(b){
  shake=12;sfx(60,.4,'sawtooth',.1);sfx(110,.3,'square',.06);burst(b.x,b.y,26,['#f8e060','#f08020','#e83048','#8a8496','#ffffff'],2.6,3);
  for(const e of enemies.slice())if(Math.hypot(e.x-b.x,e.y-b.y)<30)hitEnemy(e,2,'bomb',Math.sign(e.x-b.x)*3,Math.sign(e.y-b.y)*3);

function reflectNear(x,y,r){
  for(const s of shots){if(s.pl||s.refl)continue;if(Math.abs(s.x-x)<r&&Math.abs(s.y-y)<r)reflect(s);}
}
function reflect(s){s.refl=true;s.life=160;const w=enemies.find(e=>e.type=='wraith');
  if(s.k=='orb'&&w){const a=Math.atan2(w.y-s.y,w.x-s.x),v=Math.hypot(s.vx,s.vy)*1.6;s.vx=Math.cos(a)*v;s.vy=Math.sin(a)*v;}else{s.vx*=-1.3;s.vy*=-1.3;}
  sfx(1100,.06);burst(s.x,s.y,4,['#ffffff'],1.2,2);}

/* ---------- update ---------- */
const keys={up:0,down:0,left:0,right:0,a:0,b:0},press={a:0,b:0,menu:0},hold={up:0,down:0,left:0,right:0};
function updHold(){for(const d in hold)hold[d]=keys[d]?hold[d]+1:0;}
const nav=d=>hold[d]==1||(hold[d]>18&&hold[d]%5==0);
function update(){
  frame++;updHold();
  if(fade>0)fade--;if(bannerT>0)bannerT--;if(toastT>0)toastT--;if(shake>0)shake--;
  if(p&&p.hold&&--p.hold.t<=0)p.hold=null;
  if(mode=='title')titleUpdate();
  else if(mode=='win'){winT++;if(press.a&&winT>60){mode='title';titleInit();}}
  else if(trans){trans.t++;if(trans.t>=20)trans=null;}
  else if(menu)menuUpdate();
  else if(shop)shopUpdate();
  else if(dlg)dlgUpdate();
  else if(press.menu){menu={tab:0,cur:Math.max(0,ITEMS.findIndex(i=>i.id==st.eq)),jc:0,jt:0,rd:null};sfx(880,.05);}
  else play();
  for(const k in press)press[k]=0;
  if(needSave&&mode=='play'&&!trans){needSave=false;save();}
}
function play(){
  for(let i=parts.length-1;i>=0;i--){const q=parts[i];q.x+=q.vx;q.y+=q.vy;q.vx*=.9;q.vy*=.9;if(--q.life<=0)parts.splice(i,1);}
  if(p.inv>0)p.inv--;
  for(const t of p.trail)t.a-=.1;p.trail=p.trail.filter(t=>t.a>0);
  if(p.kt>0){p.kt--;moveP(p.kx,p.ky);}
  else if(p.dash>0){p.dash--;const ox=p.x,oy=p.y;moveP(DX[p.dir]*3,DY[p.dir]*3);if(frame%2==0)p.trail.push({s:heroSpr().s,x:p.x,y:p.y,a:1});
    if(ox==p.x&&oy==p.y){p.dash=0;shake=4;sfx(120,.08);}
    for(const e of enemies.slice())if(!e.gone&&Math.abs(e.x-p.x)<12&&Math.abs(e.y-p.y)<12)hitEnemy(e,1,'dash',DX[p.dir]*3,DY[p.dir]*3);}
  else if(p.spin>0){p.spin--;
    for(const e of enemies.slice()){const dx=e.x-p.x,dy=e.y-p.y,d=Math.hypot(dx,dy)||1;if(d<(e.boss?28:24))hitEnemy(e,2,'spin',dx/d*3,dy/d*3);}
    reflectNear(p.x,p.y-3,22);}
  else if(p.atk>0){p.atk--;if(p.atk==0&&keys.a){p.charging=true;p.charge=0;}}
  else{
    if(p.charging){if(keys.a){if(p.charge<60&&++p.charge==40)sfx(1200,.08,'triangle');}
      else{if(p.charge>=40){p.spin=22;sfx(500,.25,'sawtooth',.05);}p.charging=false;p.charge=0;}}
    const dx=keys.right-keys.left,dy=keys.down-keys.up;
    if(dx||dy){
      if(!p.charging){if(dx&&!dy)p.dir=dx>0?3:1;else if(dy&&!dx)p.dir=dy>0?0:2;
        else if(!((p.dir==3&&dx>0)||(p.dir==1&&dx<0)||(p.dir==0&&dy>0)||(p.dir==2&&dy<0)))p.dir=dx>0?3:1;}
      const sp0=p.charging?.8:1.3,l=Math.hypot(dx,dy);moveP(dx/l*sp0,dy/l*sp0);p.moving=true;
      const [fx,fy]=front(8);if(tileAt(fx,fy)=='L')tryUnlock(Math.floor(fx/TS),Math.floor(fy/TS),false);
    }else p.moving=false;
    if(press.a){if(!interact()){p.atk=14;p.charging=false;sfx(420,.05);}}
    else if(press.b)useItem();
  }
  if(dlg||shop||menu)return;
  if(p.atk>5){
    const hx=p.x+DX[p.dir]*12,hy=p.y-2+DY[p.dir]*12;
    for(const e of enemies.slice()){const r=e.boss?14:11;
      if(!e.gone&&Math.abs(e.x-hx)<r&&Math.abs(e.y-hy)<r){const res=hitEnemy(e,1,'paddle',DX[p.dir]*2.5,DY[p.dir]*2.5);
        if(res=='clank'){p.kx=-DX[p.dir]*2;p.ky=-DY[p.dir]*2;p.kt=6;p.atk=0;}
        if(dlg||mode!='play')return;}}
    reflectNear(hx,hy,11);
  }
  for(const e of enemies.slice())updEnemy(e);
  if(dlg||mode!='play')return;
  for(const e of enemies){if(e.gone||(e.type=='turtle'&&e.state=='stun')||e.stun>0)continue;const r=e.type=='turtle'?13:e.boss?11:9;
    if(Math.abs(e.x-p.x)<r&&Math.abs(e.y-p.y)<r){hurt(e.type=='vampire'||(e.type=='turtle'&&e.state=='charge')?2:1,e.x,e.y);if(dlg)return;}}
  for(let i=shots.length-1;i>=0;i--){const s=shots[i];s.x+=s.vx;s.y+=s.vy;s.life--;
    if(s.life<=0||s.x<-8||s.y<-8||s.x>W+8||s.y>PH+8){shots.splice(i,1);continue;}
    if(s.pl||s.refl){
      if(s.pl&&blockedPt(s.x,s.y,BALLSOLID)){burst(s.x,s.y,3,['#ffffff'],1,1);shots.splice(i,1);continue;}
      for(const e of enemies){if(!e.gone&&Math.abs(e.x-s.x)<(e.boss?13:9)&&Math.abs(e.y-4-s.y)<(e.boss?14:10)){
        const r=hitEnemy(e,1,s.refl&&s.k=='orb'?'refl':'shot',s.vx*.6,s.vy*.6);if(r!==false){shots.splice(i,1);break;}}}
      if(dlg||mode!='play')return;
    }else if(Math.abs(s.x-p.x)<7&&Math.abs(s.y-(p.y-4))<8){
      const v=Math.hypot(s.vx,s.vy)||1;
      if(st.shield&&p.atk==0&&!p.spin&&(DX[p.dir]*s.vx+DY[p.dir]*s.vy)/v<-.5)reflect(s);
      else{shots.splice(i,1);hurt(1,s.x,s.y);if(dlg)return;}
    }}
  for(let i=bombs.length-1;i>=0;i--){const b=bombs[i];if(--b.t<=0){bombs.splice(i,1);explode(b);if(dlg)return;}else if(b.t%12==0)sfx(1600-b.t*10,.02,'square',.015);}
  if(bug)updBug();
  for(let i=picks.length-1;i>=0;i--){const k=picks[i];k.life--;
    if(k.life<=0){picks.splice(i,1);continue;}
    if(Math.abs(k.x-p.x)<10&&Math.abs(k.y-p.y)<10){picks.splice(i,1);collect(k);if(dlg)return;}}
  if(!cur.ow&&!cur.bossT&&cur.en.length&&!enemies.length&&!st.f['clr:'+curId]){st.f['clr:'+curId]=1;needSave=true;
    if((cur.chests||[]).some(c=>c.appear&&!st.f['c:'+c.id])&&cur.solve=='clear'){refresh();tune(SECRET);toast('A chest appeared!');burst(128,88,12,['#fff2a8','#ffffff'],2,2);}}
  // doors, stairs, screen edges
  const t=tileAt(p.x,p.y);
  if(t=='D'){const tx=Math.floor(p.x/TS),ty=Math.floor(p.y/TS),d=(cur.doors||[]).find(q=>q.tx==tx&&q.ty==ty);
    if(d){if(d.need=='keystones'&&nKeys()<3){p.x=d.ret[0]*TS+8;p.y=d.ret[1]*TS+8;p.dir=0;say(['The tunnel mouth is sealed. Three hollows in the stone wait for keystones. You have '+nKeys()+'.']);}
      else{st.ret=[curId,d.ret[0],d.ret[1]];st.dent=d.to;const intro=d.to=='tunnel:0,1'&&!st.f.tunIntro;load(d.to);p.x=128;p.y=8*TS+6;p.dir=2;
        if(intro){st.f.tunIntro=1;say(['The keystones crumble and the seal splits. Cold air breathes out of the dark.','Rubble chokes the tunnel ahead. Good thing you brought powder.']);}}}}
  else if(t=='E'&&st.ret){const r=st.ret;st.dent=null;load(r[0]);p.x=r[1]*TS+8;p.y=r[2]*TS+8;p.dir=0;}
  else{
    let nx=cur.ax,ny=cur.ay,ox=p.x,oy=p.y;
    if(p.x<3){nx--;p.x=W-8;}else if(p.x>W-3){nx++;p.x=8;}else if(p.y<3){ny--;p.y=PH-8;}else if(p.y>PH-3){ny++;p.y=8;}
    if(nx!=cur.ax||ny!=cur.ay){const nid=cur.area+':'+nx+','+ny;
      if(SC[nid]){const old=cur.cv[(frame>>4)&3],dx=nx-cur.ax,dy=ny-cur.ay;load(nid);fade=0;trans={old,dx,dy,t:0};}
      else{p.x=clamp(ox,8,W-8);p.y=clamp(oy,8,PH-8);}}
  }
}
function updBug(){
  const b=bug;b.t++;
  if(!b.ret){b.x+=b.vx;b.y+=b.vy;if(b.t>=24||blockedPt(b.x,b.y,BUGSOLID))b.ret=true;}
  else{const dx=p.x-b.x,dy=p.y-4-b.y,d=Math.hypot(dx,dy)||1;if(d<6){bug=null;for(const k of b.carry)collect(k);return;}b.x+=dx/d*4.2;b.y+=dy/d*4.2;}
  for(let i=picks.length-1;i>=0;i--){const k=picks[i];if(Math.abs(k.x-b.x)<9&&Math.abs(k.y-b.y)<9){b.carry.push(k);picks.splice(i,1);b.ret=true;}}
  for(const k of b.carry){k.x=b.x;k.y=b.y+6;}
  for(const e of enemies)if(!e.gone&&!b.hit.has(e)&&Math.abs(e.x-b.x)<10&&Math.abs(e.y-b.y)<10){b.hit.add(e);b.ret=true;
    if(e.boss)sfx(1500,.04);else{e.stun=80;if(e.hp<=1)hitEnemy(e,1,'bug',0,0);}}
  if(frame%6==0)sfx(1800,.02,'square',.01);
}

/* ---------- tile art ---------- */
function R(x,y,w,h,c){g.fillStyle=c;g.fillRect(x,y,w,h);}
function grass(x,y,h){
  R(x,y,16,16,'#58a848');
  for(let i=0;i<4;i++){const q=HH(h,i,7);R(x+q%13,y+(q>>4)%14,2+(q>>8)%3,1+(q>>11)%2,i&1?'#4c9a40':'#68b854');}
  if(h%3==0){const a=x+2+(h>>3)%10,b=y+4+(h>>7)%9;R(a,b,1,1,'#2f7a38');R(a+1,b-1,1,2,'#2f7a38');R(a+2,b,1,1,'#2f7a38');R(a+1,b-2,1,1,'#84cc68');}
}
function flowers(x,y,h){
  grass(x,y,h+1);const cs=['#f8e060','#f08098','#ffffff','#b890f8'];
  for(let i=0;i<4;i++){const q=HH(h,i,3),a=x+1+(i&1)*8+q%5,b=y+1+(i>>1)*8+(q>>3)%5;R(a,b+2,1,2,'#2f7a38');R(a-1,b,3,2,cs[(q>>6)%4]);R(a,b-1,1,1,cs[(q>>6)%4]);R(a,b,1,1,'#f8a030');}
}
function cobble(x,y,h){
  R(x,y,16,16,'#5e5450');const tn=['#9a8e88','#a89c94','#8a7e78'],hi=['#b4a8a0','#c2b6ae','#a4988f'];
  for(let r=0;r<4;r++){const segs=r&1?[[0,4],[4,8],[12,4]]:[[0,8],[8,8]];
    segs.forEach((sg,i)=>{const q=HH(h,r,(r&1&&i==2)?0:i)%3;R(x+sg[0],y+r*4,sg[1]-1,3,tn[q]);R(x+sg[0],y+r*4,sg[1]-1,1,hi[q]);});}
}
function sidewalk(x,y,h){

  else if(KB.includes(e.key)){if(!e.repeat)press.b=1;keys.b=1;e.preventDefault();}
  else if(KMENU.includes(e.key)){if(!e.repeat)press.menu=1;e.preventDefault();}});
addEventListener('keyup',e=>{const k=KM[e.key];if(k)keys[k]=0;if(KA.includes(e.key))keys.a=0;if(KB.includes(e.key))keys.b=0;});
addEventListener('blur',()=>{for(const k in keys)keys[k]=0;});
const pad=document.getElementById('pad'),knob=document.getElementById('knob');
function padMove(e){
  const r=pad.getBoundingClientRect(),dx=e.clientX-(r.left+r.width/2),dy=e.clientY-(r.top+r.height/2),m=Math.hypot(dx,dy);
  keys.up=keys.down=keys.left=keys.right=0;
  if(m>r.width*.1){const ax=dx/m,ay=dy/m;if(ax>.38)keys.right=1;if(ax<-.38)keys.left=1;if(ay>.38)keys.down=1;if(ay<-.38)keys.up=1;}
  const c=Math.min(m,r.width*.3)/(m||1);knob.style.transform='translate('+dx*c+'px,'+dy*c+'px)';
}
function padEnd(){keys.up=keys.down=keys.left=keys.right=0;knob.style.transform='';}
pad.addEventListener('pointerdown',e=>{wake();try{pad.setPointerCapture(e.pointerId);}catch(_){ }padMove(e);e.preventDefault();});
pad.addEventListener('pointermove',e=>{if(e.buttons||e.pointerType=='touch')padMove(e);});
pad.addEventListener('pointerup',padEnd);pad.addEventListener('pointercancel',padEnd);
function bindBtn(el,k){
  el.addEventListener('pointerdown',e=>{wake();press[k]=1;keys[k]=1;el.classList.add('on');try{el.setPointerCapture(e.pointerId);}catch(_){ }e.preventDefault();});
  const up=()=>{keys[k]=0;el.classList.remove('on');};
  el.addEventListener('pointerup',up);el.addEventListener('pointercancel',up);
}
bindBtn(document.getElementById('act'),'a');bindBtn(document.getElementById('bbtn'),'b');
document.getElementById('menu').addEventListener('pointerdown',e=>{wake();press.menu=1;e.preventDefault();});
cv.addEventListener('pointerdown',e=>{wake();if(mode!='play'||dlg||menu)press.a=1;e.preventDefault();});
addEventListener('contextmenu',e=>e.preventDefault());

/* ---------- loop ---------- */
titleInit();
let last=0,acc=0,paused=false;
function loop(t){
  if(!paused){acc+=Math.min(100,t-last);while(acc>=16.6){update();acc-=16.6;}draw();}
  last=t;requestAnimationFrame(loop);
}
if(document.fonts&&document.fonts.load)document.fonts.load('8px "Press Start 2P"').catch(()=>{});
requestAnimationFrame(t=>{last=t;loop(t);});
window.__g={SC,LORE,update,draw,keys,press,load,mk,say,give,newGame,refresh,explode,
  get p(){return p},get st(){return st},get mode(){return mode},set mode(v){mode=v},get enemies(){return enemies},get dlg(){return dlg},set dlg(v){dlg=v},
  get cur(){return cur},get menu(){return menu},set menu(v){menu=v},get shop(){return shop},set shop(v){shop=v},get picks(){return picks},get bug(){return bug},pause(v){paused=v},SOLID};
