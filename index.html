<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, user-scalable=no, viewport-fit=cover">
<meta name="theme-color" content="#12141c">
<meta name="apple-mobile-web-app-capable" content="yes">
<meta name="mobile-web-app-capable" content="yes">
<meta name="apple-mobile-web-app-status-bar-style" content="black-translucent">
<meta name="apple-mobile-web-app-title" content="River City">
<link rel="manifest" href="manifest.webmanifest">
<link rel="icon" href="icon-192.png">
<link rel="apple-touch-icon" href="icon-180.png">
<title>River City Quest</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link href="https://fonts.googleapis.com/css2?family=Press+Start+2P&family=Barlow+Semi+Condensed:wght@500;600&display=swap" rel="stylesheet">
<style>
:root{
  /* Layout: one screen. Slim masthead, game canvas fills the middle, thumb controls along the bottom. */
  --night:#12141c;      /* page ground: fog at night */
  --slate:#1e2230;      /* raised surfaces */
  --fog:#aeb7c2;        /* body text */
  --brick:#9a4b38;      /* Richmond brick: the A button */
  --river:#3f7f96;      /* the James: the B button */
  --lamp:#f2c14e;       /* gaslight accent */
  --display:"Press Start 2P", ui-monospace, Menlo, monospace;
  --body:"Barlow Semi Condensed", system-ui, sans-serif;
  color-scheme:dark;
}
*{box-sizing:border-box}
html,body{height:100%;margin:0}
body{background:var(--night);color:var(--fog);font-family:var(--body);display:flex;flex-direction:column;overflow:hidden;
  -webkit-user-select:none;user-select:none;-webkit-touch-callout:none;touch-action:none}
header{display:flex;align-items:center;justify-content:space-between;gap:12px;padding:calc(8px + env(safe-area-inset-top)) calc(16px + env(safe-area-inset-right)) 8px calc(16px + env(safe-area-inset-left));border-bottom:2px solid var(--slate)}
h1{font-family:var(--display);font-size:11px;letter-spacing:.5px;margin:0;color:var(--lamp);font-weight:400;white-space:nowrap;min-width:0;overflow:hidden;text-overflow:ellipsis}
header p{margin:0;font-size:14px;font-weight:500;white-space:nowrap;overflow:hidden;text-overflow:ellipsis;display:none}
.hbtns{display:flex;gap:8px;flex:none}
.hb{font-family:var(--display);font-size:8px;color:var(--fog);background:var(--slate);border:2px solid #2c3246;border-radius:14px;padding:8px 10px;touch-action:none}
.hb[hidden]{display:none}
@media (max-width:520px){header{gap:8px;padding-left:calc(10px + env(safe-area-inset-left));padding-right:calc(10px + env(safe-area-inset-right))}h1{font-size:8px;flex:1 1 auto}.hbtns{gap:6px}.hb{font-size:7px;padding:8px 8px}.hb .lg{display:none}#snd::before{content:'\266A ';}}
@media (max-width:340px){h1{display:none}header{justify-content:flex-end}}
.hb:focus-visible,.btn:focus-visible{outline:3px solid var(--lamp);outline-offset:3px}
#stage{flex:1;min-height:0;display:flex;align-items:center;justify-content:center;padding:8px 16px}
canvas{display:block;max-width:100%;max-height:100%;image-rendering:pixelated;border:3px solid var(--slate);border-radius:4px;background:#000;touch-action:none}
#controls{display:flex;align-items:center;justify-content:space-between;padding:4px calc(18px + env(safe-area-inset-right)) calc(20px + env(safe-area-inset-bottom)) calc(18px + env(safe-area-inset-left));gap:12px}
#pad{position:relative;width:132px;height:132px;border-radius:50%;background:var(--slate);border:2px solid #2c3246;touch-action:none;flex:none}
#pad i{position:absolute;width:0;height:0;border:9px solid transparent;opacity:.75}
#pad .u{left:50%;top:13px;margin-left:-9px;border-bottom-color:var(--fog);border-top-width:0}
#pad .d{left:50%;bottom:13px;margin-left:-9px;border-top-color:var(--fog);border-bottom-width:0}
#pad .l{top:50%;left:13px;margin-top:-9px;border-right-color:var(--fog);border-left-width:0}
#pad .r{top:50%;right:13px;margin-top:-9px;border-left-color:var(--fog);border-right-width:0}
#knob{position:absolute;left:50%;top:50%;width:44px;height:44px;margin:-22px 0 0 -22px;border-radius:50%;background:#394058;pointer-events:none}
#btns{position:relative;width:156px;height:124px;flex:none}
.btn{position:absolute;border-radius:50%;border:0;color:#fff;font-family:var(--display);line-height:1.5;touch-action:none}
#act{right:0;top:0;width:84px;height:84px;background:var(--brick);box-shadow:0 5px 0 #6c3020;font-size:15px}
#bbtn{left:0;bottom:4px;width:66px;height:66px;background:var(--river);box-shadow:0 5px 0 #26566a;font-size:13px}
.btn small{display:block;font-size:7px;opacity:.85}
.btn:active,.btn.on{transform:translateY(3px)}
#fs{display:none}
/* phones held sideways: pad on the left, buttons on the right, game in the middle */
@media (orientation:landscape) and (max-height:560px) and (pointer:coarse){
  body{display:grid;grid-template-columns:auto 1fr auto;grid-template-rows:auto 1fr}
  header{grid-column:1/4;padding-top:calc(4px + env(safe-area-inset-top));padding-bottom:4px}
  #stage{grid-column:2;grid-row:2;padding:4px 6px calc(4px + env(safe-area-inset-bottom))}
  #controls{display:contents}
  #pad{grid-column:1;grid-row:2;align-self:center;margin-left:calc(14px + env(safe-area-inset-left));margin-bottom:env(safe-area-inset-bottom)}
  #btns{grid-column:3;grid-row:2;align-self:center;margin-right:calc(14px + env(safe-area-inset-right));margin-bottom:env(safe-area-inset-bottom)}
  #fs:not([hidden]){display:inline-block}
  h1{font-size:9px}
}
@media (hover:hover) and (pointer:fine){
  #controls,#menu{display:none}
  header p{flex:1;min-width:0}
  header p{display:block}
  #stage{padding-bottom:16px}
}
</style>
</head>
<body>
<header>
  <h1>River City Quest</h1>
  <p>Arrows or WASD move. Z or Space: A (swing, talk, read; hold for a spin). X: B (item). Enter: menu. N: sound.</p>
  <div class="hbtns">
    <button id="install" class="hb" type="button" hidden>INSTALL</button>
    <button id="fs" class="hb" type="button" hidden aria-label="Full screen">FULL</button>
    <button id="snd" class="hb" type="button" aria-pressed="true"><span class="lg">SOUND </span>ON</button>
    <button id="menu" class="hb" type="button" aria-label="Open the inventory menu">MENU</button>
  </div>
</header>
<div id="stage"><canvas id="game" width="768" height="600" aria-label="River City Quest game screen"></canvas></div>
<div id="controls">
  <div id="pad" aria-label="Direction pad"><i class="u"></i><i class="d"></i><i class="l"></i><i class="r"></i><div id="knob"></div></div>
  <div id="btns">
    <button id="bbtn" class="btn" type="button" aria-label="Use the item on B">B<small>ITEM</small></button>
    <button id="act" class="btn" type="button" aria-label="Swing paddle, talk or read">A<small>PADDLE</small></button>
  </div>
</div>
<script src="js/world.js"></script>
<script src="js/es.js"></script>
<script src="js/es-text.js"></script>
<script src="js/core.js"></script>
<script src="js/people.js"></script>
<script src="js/play.js"></script>
<script src="js/art.js"></script>
<script src="js/style.js"></script>
<script src="js/draw.js"></script>
<script src="js/systems.js"></script>
<script src="js/minigames.js"></script>
<script src="js/extras.js"></script>
<script src="js/life.js"></script>
<script src="js/rva.js"></script>
<script src="js/main.js"></script>
<script src="js/music.js"></script>
</body>
</html>
